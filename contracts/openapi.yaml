                type: object
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auditor/system-logs:
    get:
      operationId: auditorSystemLogs
      tags: [auditor]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: System logs
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auditor/stats:
    get:
      operationId: auditorStats
      tags: [auditor]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Auditor statistics
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==================== EXECUTIVE ====================
  /executive/dashboard:
    get:
      operationId: getExecutiveDashboard
      tags: [executive]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Executive dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutiveDashboard"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /executive/regional-stats:
    get:
      operationId: getExecutiveRegionalStats
      tags: [executive]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Regional statistics
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /executive/trend-analysis:
    get:
      operationId: getExecutiveTrendAnalysis
      tags: [executive]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Trend analysis
          content:
            application/json:
              schema:

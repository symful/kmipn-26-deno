        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==================== WARGA ====================
  /warga/sanggahan/{id}:
    post:
      operationId: submitSanggahan
      tags: [warga]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SanggahanRequest"
      responses:
        "201":
          description: Sanggahan submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  id:
                    type: string
                    format: uuid
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Sanggahan already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /warga/reopen/{id}:
    post:
      operationId: requestReopen
      tags: [warga]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReopenRequest"
      responses:
        "201":
          description: Reopen requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  id:
                    type: string
                    format: uuid
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Reopen request already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /warga/evidence/{id}:
    post:
      operationId: submitWargaEvidence
      tags: [warga]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [description, photo]
              properties:
                description:
                  type: string
                photo:
                  type: string
                  format: binary
      responses:
        "201":
          description: Evidence submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  evidence_id:
                    type: string
                    format: uuid
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Storage error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==================== GEOCODE ====================
  /geocode:
    get:
      operationId: reverseGeocode
      tags: [geocode]
      security: []
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
        - name: lng
          in: query
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Geocoded address
          content:
            application/json:
              schema:
                type: object
                properties:
                  address:
                    type: string
                  road:
                    type: string
                    nullable: true
                  village:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                  subdistrict:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                  district:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                  province:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No wilayah found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

# ==================== COMPONENTS ====================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # Enums
    Role:
      type: string
      enum: [WARGA, SURVEYOR, VERIFIKATOR, OPERATOR, PETUGAS, PENGAMBIL_KEPUTUSAN, ADMIN_DAERAH, AUDITOR, RT_RW, ADMIN]

    ReportStatus:
      type: string
      enum:
        - draft
        - submitted
        - under_review
        - verified
        - assigned
        - in_progress
        - resolved
        - closed
        - rejected
        - duplicate_merged
        - needs_survey
        - needs_completion
        - out_of_scope
        - merged
        - separated
        - escalated

    AssessmentStatus:
      type: string
      enum:
        - completed
        - timeout
        - parse_failed
        - vlm_error

    # Common
    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
        details:
          type: object
          nullable: true

    # Auth
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
          maxLength: 128

    LoginResponse:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
        user:
          $ref: "#/components/schemas/User"

    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    TokenResponse:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer

    RegisterVerifikatorRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 255
        wilayah_id:
          type: string
          format: uuid
          nullable: true

    # User
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true

    UserCreateRequest:
      type: object
      required: [email, password, name, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 255
        role:
          $ref: "#/components/schemas/Role"
        wilayah_id:
          type: string
          format: uuid
          nullable: true

    UserUpdateRequest:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/Role"
        password:
          type: string
          minLength: 8
          maxLength: 128
        disabled:
          type: boolean

    # Category
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        icon:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        parent_id:
          type: string
          format: uuid
          nullable: true
        code:
          type: string
          nullable: true
        short_code:
          type: string
          nullable: true
        color_class:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    CategoryCreateRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          minLength: 1
          maxLength: 100
        icon:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 500
        parent_id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 10
        short_code:
          type: string
          maxLength: 5
        color_class:
          type: string
          maxLength: 20

    CategoryUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          minLength: 1
          maxLength: 100
        icon:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 500
        parent_id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 10
        short_code:
          type: string
          maxLength: 5
        color_class:
          type: string
          maxLength: 20

    # Wilayah
    Wilayah:
      type: object
      properties:
        id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        level:
          type: string
          enum: [PROVINSI, KABUPATEN, KECAMATAN, DESA]

    WilayahCreateRequest:
      type: object
      required: [name, level]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        parent_id:
          type: string
          format: uuid
        level:
          type: string
          enum: [PROVINSI, KABUPATEN, KECAMATAN, DESA]

    WilayahUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255

    # Report
    Report:
      type: object
      properties:
        id:
          type: string
          format: uuid
        idempotency_key:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        category:
          $ref: "#/components/schemas/Category"
          nullable: true
        description:
          type: string
        geom:
          type: object
          nullable: true
        lat:
          type: number
        lng:
          type: number
        photo_urls:
          type: array
          items:
            type: string
        exif_data:
          type: object
          nullable: true
        device_id:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/ReportStatus"
        severity:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
        assigned_to:
          type: string
          format: uuid
          nullable: true
        assignee:
          $ref: "#/components/schemas/User"
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ReportCreateRequest:
      type: object
      required: [idempotency_key, category_id, description, lat, lng]
      properties:
        idempotency_key:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        description:
          type: string
          minLength: 1
          maxLength: 2000
        lat:
          type: number
        lng:
          type: number
        device_id:
          type: string
          format: uuid
        photo_urls:
          type: array
          items:
            type: string
            format: uri
        reported_at:
          type: string
          format: date-time
        title:
          type: string
          maxLength: 255
        population_affected:
          type: integer
          minimum: 0
        vulnerability_index:
          type: number
          minimum: 0
          maximum: 1
        consent:
          type: boolean

    ReportUpdateRequest:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ReportStatus"
        description:
          type: string
          minLength: 1
          maxLength: 2000
        priority:
          type: integer
          minimum: 0
          maximum: 100
        assigned_to:
          type: string
          format: uuid
          nullable: true

    PublicReportCreateRequest:
      type: object
      required: [idempotency_key, category_id, description, lat, lng, device_id]
      properties:
        idempotency_key:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        description:
          type: string
          minLength: 10
          maxLength: 500
        lat:
          type: number
        lng:
          type: number
        device_id:
          type: string
          format: uuid
        photo_urls:
          type: array
          items:
            type: string
            format: uri
        reported_at:
          type: string
          format: date-time
        title:
          type: string
          maxLength: 255
        population_affected:
          type: integer
          minimum: 0
        vulnerability_index:
          type: number
          minimum: 0
          maximum: 1
        consent:
          type: boolean

    ReportsStats:
      type: object
      properties:
        total:
          type: integer
        by_status:
          type: object
          additionalProperties:
            type: integer
        by_category:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              slug:
                type: string
              icon:
                type: string
                nullable: true
              count:
                type: integer
        by_wilayah:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              count:
                type: integer
        sla_breached:
          type: integer
        sla_at_risk:
          type: integer
        avg_verification_days:
          type: number
          nullable: true

    OperatorStats:
      type: object
      properties:
        total:
          type: integer
        by_status:
          type: object
          additionalProperties:
            type: integer
        by_severity:
          type: object
          additionalProperties:
            type: integer
        sla_breached:
          type: integer
        sla_at_risk:
          type: integer
        avg_resolution_days:
          type: number
          nullable: true
        by_category:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              slug:
                type: string
              count:
                type: integer
        recent_escalations:
          type: integer

    ExecutiveDashboard:
      type: object
      properties:
        total:
          type: integer
        by_status:
          type: object
          additionalProperties:
            type: integer
        by_category:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              slug:
                type: string
              icon:
                type: string
                nullable: true
              count:
                type: integer
        sla_breached:
          type: integer
        sla_at_risk:
          type: integer
        recent_submissions:
          type: integer
        resolved_this_month:
          type: integer
        avg_verification_days:
          type: number
          nullable: true
        avg_resolution_days:
          type: number
          nullable: true
        active_operators:
          type: integer
        active_petugas:
          type: integer
        total_wilayah:
          type: integer

    # Agent
    AgentAssessRequest:
      type: object
      required: [report_id]
      properties:
        report_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
          maxLength: 255

    # Verifikator
    VerifikatorCombineRequest:
      type: object
      required: [target_case_id]
      properties:
        target_case_id:
          type: string
        reason:
          type: string

    VerifikatorSeparateRequest:
      type: object
      required: [new_case_description]
      properties:
        new_case_description:
          type: string
        reason:
          type: string

    VerifikatorRejectRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 10

    VerifikatorDecisionRequest:
      type: object
      required: [decision, reason]
      properties:
        decision:
          type: string
          enum: [valid, needs_completion, needs_survey, duplicate, out_of_scope, rejected]
        reason:
          type: string
          minLength: 1
        duplicate_of_report_id:
          type: string
          format: uuid
        surveyor_id:
          type: string
          format: uuid
        assigned_unit_id:
          type: string
          format: uuid
        deadline:
          type: string
          format: date-time

    VerifikatorReviewSanggahanRequest:
      type: object
      required: [decision, reason]
      properties:
        decision:
          type: string
          enum: [accepted, rejected]
        reason:
          type: string
          minLength: 1

    VerifikatorVerifyCompletionRequest:
      type: object
      required: [decision, reason]
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        reason:
          type: string
          minLength: 1
        completion_notes:
          type: string

    # Photo
    PhotoUploadRequest:
      type: object
      properties:
        content_type:
          type: string
          enum: [image/jpeg, image/png]
        idempotency_key:
          type: string
          format: uuid
        file:
          type: string

    PhotoBatchUploadRequest:
      type: object
      required: [photos]
      properties:
        photos:
          type: array
          items:
            type: string
            enum: [image/jpeg, image/png]
          minItems: 1
          maxItems: 20

    # Warga
    SanggahanRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 10

    ReopenRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 10

    # GeoJSON
    GeoJSONFeatureCollection:
      type: object
      required: [type, features]
      properties:
        type:
          type: string
          const: FeatureCollection
        features:
          type: array
          items:
            $ref: "#/components/schemas/GeoJSONFeature"

    GeoJSONFeature:
      type: object
      required: [type, geometry, properties]
      properties:
        type:
          type: string
          const: Feature
        geometry:
          type: object
          oneOf:
            - $ref: "#/components/schemas/GeoJSONPoint"
            - $ref: "#/components/schemas/GeoJSONPolygon"
        properties:
          type: object
          required: [id, status, category_id, description, created_at]
          properties:
            id:
              type: string
              format: uuid
            status:
              $ref: "#/components/schemas/ReportStatus"
